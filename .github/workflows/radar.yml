name: Radar

# Every Monday: read the last 30 days of Form D filings from SEC EDGAR, score them against
# the committed H-1B history extract, and commit the new radar. Vercel redeploys on the push.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # Form D XML never changes once filed, so keep it between runs and fetch only new ones.
      - uses: actions/cache@v4
        with:
          path: data/raw/edgar
          key: edgar-${{ github.run_id }}
          restore-keys: edgar-
      - name: Fetch recent Form D filings from EDGAR
        run: python -m fundsponsor.fetch_edgar_recent --days 30
      - name: Build the radar models
        # cautious: skip tests that also need models this job does not build
        run: dbt deps && dbt seed && dbt build --select +radar --indirect-selection=cautious
        working-directory: dbt
      - name: Export radar.json and the dated Markdown list
        run: python -m fundsponsor.export_radar
      - name: Commit the new radar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar web/public/data/radar.json
          git diff --cached --quiet || git commit -m "radar: $(date -u +%F)"
          git push
