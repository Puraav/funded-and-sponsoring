version: 2

seeds:
  - name: bay_area_zips
    description: >
      ZIP codes whose main county (largest land-area overlap in the Census 2020 ZCTA-county
      relationship file) is one of the nine Bay Area counties. Built by
      `python -m fundsponsor.make_seeds`.
    config:
      column_types: {zip: varchar, county_fips: varchar, county_name: varchar}
    columns:
      - name: zip
        description: 5-character ZIP code.
        tests: [unique, not_null]
      - name: county_fips
        tests: [not_null]
      - name: county_name
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Alameda, Contra Costa, Marin, Napa, San Francisco, San Mateo, Santa Clara, Solano, Sonoma]

  - name: fund_name_patterns
    description: Regular expressions (matched on the lower-cased issuer name) that mark funds and SPVs, which are not startups.
    config:
      column_types: {pattern: varchar, reason: varchar}
    columns:
      - name: pattern
        tests: [unique, not_null]

  - name: excluded_industry_groups
    description: Form D industry groups that are funds, finance or real estate rather than operating startups.
    config:
      column_types: {industry_group: varchar, reason: varchar}
    columns:
      - name: industry_group
        tests: [unique, not_null]

  - name: soc_role_groups
    description: Occupation (SOC) codes that map straight to a role group. Other 15-xxxx codes are "Other tech"; everything else is "Non-tech".
    config:
      column_types: {soc_code: varchar, role_group: varchar}
    columns:
      - name: soc_code
        description: First seven characters of the SOC code, e.g. `15-1252`.
        tests: [unique, not_null]
      - name: role_group
        tests:
          - accepted_values:
              arguments:
                values: [Software, Data]

  - name: title_keywords
    description: >
      Job-title keywords that set the role group. A keyword match wins over the SOC code; the
      lowest `priority` wins when several match. When `only_soc` is filled, the keyword counts
      only for that SOC code.
    config:
      column_types: {keyword: varchar, role_group: varchar, priority: integer, only_soc: varchar}
    columns:
      - name: keyword
        description: Lower-case text looked for inside the job title.
        tests: [unique, not_null]
      - name: role_group
        tests:
          - accepted_values:
              arguments:
                values: [Software, Data, Product]
      - name: priority
        tests: [not_null]
      - name: only_soc
        description: If set, the keyword applies only to this SOC code.

  - name: generic_names
    description: Common one-word company names. A startup with one of these as its whole name key may only match an employer in the very same ZIP code.
    config:
      column_types: {name_key: varchar}
    columns:
      - name: name_key
        tests: [unique, not_null]

  - name: name_cases
    description: Test cases for the `normalise_name` macro (raw name and the key it must produce).
    config:
      column_types: {raw: varchar, expected: varchar}
    columns:
      - name: raw
        tests: [unique, not_null]
      - name: expected
        tests: [not_null]

  - name: match_labels
    description: >
      The hand-checked sample from `data/match_sample.csv`: 60 matched pairs and 20 unmatched
      startups, each marked correct (y) or not (n) with the evidence used. Written by
      `python -m fundsponsor.match_sample --to-seed`.
    config:
      column_types:
        sample_type: varchar
        match_rule: integer
        tier: varchar
        cik: varchar
        company: varchar
        employer_name: varchar
        employer_zip5: varchar
        correct: varchar
        confidence: varchar
        evidence: varchar
    columns:
      - name: sample_type
        tests:
          - accepted_values:
              arguments:
                values: [matched, unmatched]
      - name: match_rule
        description: Matching rule (1 to 4) for matched rows; empty for unmatched rows.
      - name: correct
        description: "`y` when the match (or the decision not to match) is right."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["y", "n"]
      - name: confidence
        description: How strong the evidence behind the label is (high, medium, low).
      - name: evidence
        description: What the label is based on.
