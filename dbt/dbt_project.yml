name: fundsponsor
version: "0.1.0"
config-version: 2
profile: fundsponsor

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: ["target", "dbt_packages"]

vars:
  # Raw parquet folder. The env var FS_DATA_DIR overrides it (CI and tests use fixtures);
  # see models/staging/_sources.yml.
  raw_dir: "../data/raw"
  # Committed extracts used by the radar models. Env var FS_SEED_CACHE overrides it.
  seed_cache_dir: "../data/seed_cache"

models:
  fundsponsor:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
    radar:
      +materialized: table
      +tags: ["radar"]
