version: 2

models:
  - name: int_bay_area_raises
    description: >
      One row per startup raise: an original Form D (not an amendment) filed on or after
      2023-10-01 by a primary issuer whose ZIP is in the nine Bay Area counties, whose industry
      group is not a fund, finance or real estate, and whose name does not look like a fund or SPV.
      Also dropped: business-combination filings (mergers, buyouts), limited partnerships, and
      LLCs filing under the catch-all "Other" industry (nearly all SPVs and property deals),
      companies registered with the SEC at the time of filing (listed companies), and the few
      long-established firms listed in the `not_startups` seed.
    columns:
      - name: accession
        description: SEC accession number of the Form D.
        tests: [unique, not_null]
      - name: cik
        description: SEC Central Index Key of the company.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: cik
      - name: company
        description: Legal name as filed.
        tests: [not_null]
      - name: street
      - name: city
      - name: zip5
        tests: [not_null]
      - name: county_name
        description: One of the nine Bay Area counties.
        tests: [not_null]
      - name: industry
        description: Form D industry group.
      - name: filing_date
        tests: [not_null]
      - name: first_sale_date
        description: Date of first sale in the offering; null if not yet sold.
      - name: amount_sold
        description: US dollars sold so far, self-reported.
      - name: amount_offered
        description: US dollars offered; null when "Indefinite".
      - name: round_bin
        description: Size bucket of `amount_sold`. `unknown` when nothing has been sold yet.
        tests:
          - accepted_values:
              arguments:
                values: ["<$2M", "$2–10M", "$10–50M", "$50M+", "unknown"]
      - name: is_first_raise
        description: >
          True when this is the company's first original Form D in the data, which starts in
          October 2022. Earlier raises cannot be seen.
        tests: [not_null]

  - name: int_lca_h1b
    description: >
      One row per certified H-1B LCA (`visa_class = 'H-1B'`, `case_status = 'Certified'`), with
      an event date, a new-hire flag, an annualised wage and a role group. Cases later withdrawn
      ("Certified - Withdrawn") are not counted.
    columns:
      - name: case_number
        tests: [unique, not_null]
      - name: event_date
        description: Date the application was received, or the decision date if that is missing.
        tests: [not_null]
      - name: received_date
      - name: decision_date
      - name: employer_name
        tests: [not_null]
      - name: trade_name_dba
      - name: employer_address1
      - name: employer_city
      - name: employer_state
      - name: employer_zip5
      - name: worksite_city
      - name: worksite_state
      - name: worksite_zip5
      - name: job_title
      - name: soc_code
        description: First seven characters of the SOC code, e.g. `15-1252`.
      - name: soc_title
      - name: total_worker_positions
      - name: is_new_hire
        description: True when the LCA is for a worker new to the employer (`new_employment > 0` or `change_employer > 0`), not an extension.
        tests: [not_null]
      - name: annual_wage
        description: >
          Offered wage per year in US dollars: `wage_rate_of_pay_from` times 1 (Year), 12 (Month),
          26 (Bi-Weekly), 52 (Week) or 2080 (Hour). Null outside $20,000 to $1,000,000.
      - name: role_group
        description: Software, Data, Product, Other tech or Non-tech. Title keywords win over the SOC code.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Software, Data, Product, Other tech, Non-tech]
      - name: pw_wage_level
        description: Prevailing wage level I, II, III or IV; null when the wage came from another source.
        tests:
          - accepted_values:
              arguments:
                values: [I, II, III, IV]

  - name: int_name_keys
    description: >
      One row per distinct name and ZIP on each side of the match: Form D startups, and LCA
      employers under both their legal name and their trade name. `name_key` comes from the
      `normalise_name` macro.
    columns:
      - name: source
        tests:
          - accepted_values:
              arguments:
                values: [formd, lca]
      - name: cik
        description: Startup's CIK; null for LCA employers.
      - name: entity_name
        description: Legal name of the startup or employer.
      - name: matched_on
        description: The name the key was built from (the legal name, or the employer's trade name).
      - name: zip5
      - name: state
      - name: name_key
        description: Normalised name used for matching.
        tests: [not_null]
      - name: first_token
        description: First word of `name_key`; a blocking key for fuzzy matching.
      - name: zip3
        description: First three digits of the ZIP; a blocking key for fuzzy matching.
      - name: is_generic
        description: True when the key is one word of five letters or fewer, or a common word in the `generic_names` seed.

  - name: int_match_candidates
    description: >
      Startup-to-employer pairs that pass a matching rule, with the strictest rule each pair
      passes. Rule 1: same name key and same ZIP. Rule 2: same name key, employer in the Bay
      Area. Rule 3: same name key, employer in California. Rule 4: name keys at least 0.97
      Jaro-Winkler similar, same first word and same 3-digit ZIP. Generic names only use rule 1.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cik, employer_name, employer_zip5]
    columns:
      - name: cik
      - name: employer_name
      - name: employer_zip5
      - name: match_rule
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false

  - name: int_match_conflicts
    description: Employers whose best rule matches more than one startup. They are dropped from `int_matches` and listed here.
    columns:
      - name: employer_name
      - name: employer_zip5
      - name: cik
      - name: company
      - name: match_rule

  - name: int_matches
    description: >
      Final matches between startups and H-1B employers. An employer (name and ZIP) is matched
      to at most one startup; a startup can have several employer records (other offices, a
      trade name, small spelling differences).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cik, employer_name, employer_zip5]
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [employer_name, employer_zip5]
    columns:
      - name: cik
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: cik
      - name: company
        description: Startup's latest legal name.
      - name: employer_name
        tests: [not_null]
      - name: employer_zip5
        tests: [not_null]
      - name: match_rule
        description: The rule (1 to 4) that produced the match; see `int_match_candidates`.
      - name: tier
        description: "`high` for rules 1 and 2, `medium` for rules 3 and 4."
        tests:
          - accepted_values:
              arguments:
                values: [high, medium]

  - name: int_post_raise_lcas
    description: >
      H-1B filings made within 12 months after a raise by the same company. Each filing appears
      once even when two raises of that company both precede it.
    columns:
      - name: case_number
        tests: [unique, not_null]
      - name: cik
      - name: event_date
      - name: role_group
      - name: pw_wage_level
      - name: annual_wage
      - name: is_new_hire
      - name: job_title
