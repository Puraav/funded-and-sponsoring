version: 2

models:
  - name: stg_formd_submissions
    description: One row per Form D filing (original `D` or amendment `D/A`), cleaned and typed.
    columns:
      - name: accession_number
        description: SEC accession number, the key of a filing.
        tests: [unique, not_null]
      - name: filing_date
        description: Date the filing was accepted by the SEC.
        tests: [not_null]
      - name: submission_type
        description: "`D` for an original notice, `D/A` for an amendment."
        tests:
          - accepted_values:
              arguments:
                values: ["D", "D/A"]
      - name: test_or_live
        description: "`LIVE` for real filings."
      - name: source_quarter
        description: The quarterly data set the row came from, e.g. `2024q1`.

  - name: stg_formd_issuers
    description: Issuers named on each filing. A filing has one primary issuer and sometimes co-issuers.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [accession_number, issuer_seq]
    columns:
      - name: accession_number
        tests: [not_null]
      - name: is_primary_issuer
        description: True for the one primary issuer of the filing.
      - name: issuer_seq
        description: Order of the issuer within the filing.
      - name: cik
        description: SEC Central Index Key of the issuer, 10 characters with leading zeros.
        tests: [not_null]
      - name: entity_name
        description: Issuer's legal name as filed, with whitespace collapsed.
      - name: street1
      - name: street2
      - name: city
      - name: state
        description: Two-letter US state, or a country code for foreign issuers.
      - name: zipcode
        description: ZIP or postal code as filed.
      - name: zip5
        description: First five digits of a US ZIP code; null when the code does not start with five digits.
      - name: jurisdiction_of_inc
      - name: entity_type
      - name: year_of_inc_timespan
      - name: year_of_inc
      - name: source_quarter

  - name: stg_formd_offerings
    description: Offering details, one row per filing. Amounts are US dollars as self-reported by the issuer.
    columns:
      - name: accession_number
        tests: [unique, not_null]
      - name: industry_group
        description: Industry group the issuer picked on the form.
      - name: investment_fund_type
        description: Filled only when the issuer is a pooled investment fund.
      - name: is_amendment
      - name: first_sale_date
        description: Date of first sale; null when the first sale is yet to occur.
      - name: sale_yet_to_occur
      - name: is_equity
      - name: is_debt
      - name: is_pooled_fund_interest
        description: True when the securities sold are interests in a pooled investment fund.
      - name: is_business_combination
        description: True when the offering is part of a merger or acquisition.
      - name: revenue_range
      - name: amount_offered
        description: Total offering amount; null when filed as "Indefinite".
      - name: amount_sold
        description: Total amount sold so far.
      - name: investor_count
      - name: source_quarter

  - name: stg_formd_people
    description: Related persons (executive officers, directors, promoters) named on each filing.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [accession_number, person_seq]
    columns:
      - name: accession_number
        tests: [not_null]
      - name: person_seq
      - name: first_name
      - name: middle_name
      - name: last_name
      - name: relationship_1
        description: Executive Officer, Director or Promoter.
      - name: relationship_2
      - name: relationship_3
      - name: source_quarter

  - name: stg_lca
    description: >
      One row per LCA case (H-1B, H-1B1 and E-3), every status, cleaned and typed. An LCA is the
      wage application an employer files with the Department of Labor before an H-1B petition.
    columns:
      - name: case_number
        description: DOL case number, the key of an LCA.
        tests: [unique, not_null]
      - name: case_status
        tests:
          - accepted_values:
              arguments:
                values: ["Certified", "Certified - Withdrawn", "Withdrawn", "Denied"]
      - name: received_date
        description: Date DOL received the application.
      - name: decision_date
        description: Date of the latest decision on the case.
      - name: visa_class
        description: "`H-1B`, `H-1B1 Chile`, `H-1B1 Singapore` or `E-3 Australian`."
      - name: job_title
      - name: soc_code
        description: Occupation code as filed, e.g. `15-1252.00`.
      - name: soc_title
      - name: is_full_time
      - name: begin_date
        description: Intended employment start date.
      - name: total_worker_positions
      - name: new_employment
        description: Positions for workers new to the employer.
      - name: continued_employment
        description: Positions that extend a current worker.
      - name: change_employer
        description: Positions for workers moving from another H-1B employer.
      - name: employer_name
        description: Employer's legal name as filed, with whitespace collapsed.
      - name: trade_name_dba
        description: Trade name ("doing business as"), when given.
      - name: employer_address1
      - name: employer_city
      - name: employer_state
        description: Two-letter state, upper case.
      - name: employer_postal_code
      - name: employer_zip5
        description: First five digits of the employer's ZIP code.
      - name: naics_code
      - name: worksite_city
      - name: worksite_state
      - name: worksite_zip5
      - name: wage_rate_of_pay_from
        description: Offered wage (bottom of the range) in `wage_unit_of_pay`.
      - name: wage_rate_of_pay_to
      - name: wage_unit_of_pay
        description: Year, Month, Bi-Weekly, Week or Hour.
      - name: prevailing_wage
      - name: pw_unit_of_pay
      - name: pw_wage_level
        description: Prevailing wage level I to IV as filed; I and II are early-career.
      - name: fiscal_year
        description: DOL fiscal year (October to September) of the file the row came from.
      - name: fiscal_quarter
