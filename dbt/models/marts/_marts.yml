version: 2

models:
  - name: dim_company
    description: One row per startup (SEC CIK) with at least one Bay Area raise, using its latest filed name and address.
    columns:
      - name: cik
        description: SEC Central Index Key.
        tests: [unique, not_null]
      - name: company
        description: Legal name on the latest raise.
        tests: [not_null]
      - name: city
      - name: zip5
      - name: county_name
      - name: industry
        description: Form D industry group on the latest raise.
      - name: first_raise_date
        tests: [not_null]
      - name: latest_raise_date
        tests: [not_null]
      - name: raise_count
        description: Number of original Form D filings since 2023-10-01.
        tests: [not_null]
      - name: total_sold
        description: Sum of `amount_sold` over those raises, in US dollars.
      - name: company_slug
        description: URL-safe, unique identifier used by the website.
        tests: [unique, not_null]

  - name: mart_match_quality
    description: >
      Match rate and checked precision of the startup-to-employer matching. One `overall` row,
      one row per matching rule in use, and one `unmatched` row. Precision comes from the
      hand-checked sample in the `match_labels` seed.
    columns:
      - name: scope
        tests:
          - accepted_values:
              arguments:
                values: [overall, rule, unmatched]
      - name: match_rule
        description: Rule number 1 to 4 on `rule` rows.
      - name: rule_name
      - name: tier
        description: "`high` or `medium` on `rule` rows."
      - name: pairs
        description: Matched (startup, employer) pairs.
      - name: startups
        description: Startups covered by the row. A startup matched by several rules is counted under each.
      - name: all_startups
        description: Every startup in `dim_company`.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: match_rate
        description: "`startups / all_startups`."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: labelled
        description: Sample rows checked by hand.
      - name: labelled_correct
      - name: match_precision
        description: >
          `labelled_correct / labelled`. On the `unmatched` row it is the share of checked
          unmatched startups for which no match was the right answer.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: small_sample
        description: True when fewer than 30 rows were checked, so the precision is rough.

  - name: fct_lca_events
    description: >
      One row per sponsoring event: a certified H-1B LCA whose employer matched a startup.
      An LCA is an application step before an H-1B petition, not an approved visa or a hire.
    columns:
      - name: case_number
        tests: [unique, not_null]
      - name: cik
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: cik
      - name: tier
        description: Confidence tier of the match that links the employer to the startup.
      - name: match_rule
      - name: event_date
        tests: [not_null]
      - name: received_date
      - name: decision_date
      - name: employer_name
      - name: employer_zip5
      - name: worksite_city
      - name: worksite_state
      - name: job_title
      - name: soc_code
      - name: soc_title
      - name: role_group
      - name: pw_wage_level
      - name: annual_wage
      - name: is_new_hire
      - name: total_worker_positions

  - name: fct_raises
    description: >
      One row per startup raise with the same company's H-1B filings around it. "Before" is the
      24 months up to the Form D filing date; "after" is the filing date and the 12 months
      that follow. The LCA data starts in October 2022, so for raises in late 2023 the
      "before" window is really 12 to 24 months long.
    columns:
      - name: accession
        tests: [unique, not_null]
      - name: cik
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: cik
      - name: company
      - name: city
      - name: county_name
      - name: industry
      - name: filing_date
      - name: first_sale_date
      - name: amount_sold
      - name: amount_offered
      - name: round_bin
      - name: is_first_raise
      - name: prior_24m
        description: Certified H-1B LCAs by the company in the 24 months before the filing date.
      - name: after_12m
        description: Certified H-1B LCAs on the filing date or in the 12 months after it.
      - name: after_12m_new_hire
        description: Those of `after_12m` that are for a new hire rather than an extension.
      - name: sponsored_after
        description: True when `after_12m` is at least 1.
        tests: [not_null]
      - name: sponsored_after_new_hire
      - name: after_software
      - name: after_data
      - name: after_product
      - name: after_other_tech
      - name: after_non_tech
      - name: median_wage_after
        description: Median annual wage across the `after_12m` filings.
      - name: first_lca_after
      - name: days_to_first_lca
        description: Days from the Form D filing to the first H-1B filing after it.
      - name: has_full_followup
        description: >
          True when the raise was filed at least 365 days before the last date in the LCA data,
          so a full year can be observed. Only these raises count in "after" rates.
        tests: [not_null]

  - name: mart_sponsor_rate
    description: >
      Headline rate: of raises with a full year of follow-up, the share followed by at least
      one H-1B filing (`any`) or one new-hire H-1B filing (`new_hire`). A startup that could
      not be matched to an employer counts as not filing, so the rates are a floor.
    columns:
      - name: metric
        tests: [unique, not_null]
      - name: metric_label
      - name: n
        description: Raises with a full year of follow-up.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: sponsored
      - name: sponsor_rate
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: small_sample
        description: True when `n` is under 30; treat the rate as rough.

  - name: mart_by_round
    description: Sponsor rate by size of raise, and the median number of H-1B filings among raises that were followed by any.
    columns:
      - name: round_bin
        tests: [unique, not_null]
      - name: round_order
        description: Sort order from smallest to largest raise; `unknown` last.
      - name: n
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: sponsored
      - name: sponsor_rate
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: median_lcas_per_sponsor
      - name: small_sample
        description: True when `n` is under 30; treat the rate as rough.

  - name: mart_by_history
    description: Sponsor rate after a raise, split by whether the company filed for H-1B workers in the 24 months before it.
    columns:
      - name: history
        tests:
          - unique
          - accepted_values:
              arguments:
                values: [sponsored_before, no_prior]
      - name: history_label
      - name: n
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: sponsored
      - name: sponsor_rate
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: small_sample
        description: True when `n` is under 30; treat the rate as rough.

  - name: mart_by_industry
    description: Sponsor rate for the eight Form D industry groups with the most raises.
    columns:
      - name: industry
        tests: [unique, not_null]
      - name: n
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: sponsored
      - name: sponsor_rate
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: small_sample
        description: True when `n` is under 30; treat the rate as rough.

  - name: mart_roles_wages
    description: >
      H-1B filings in the 12 months after a raise, by role group and prevailing wage level.
      Rows with `wage_level = 'All'` are role-group totals and carry `share_of_lcas`.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [role_group, wage_level]
    columns:
      - name: role_group
      - name: wage_level
        description: I, II, III, IV, or All.
      - name: n
        description: Number of H-1B filings.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: share_of_lcas
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: median_wage
        description: Median annual wage in US dollars.
      - name: small_sample
        description: True when `n` is under 30; treat the rate as rough.

  - name: mart_entry_level
    description: >
      Of the startups that filed after raising, the share with at least one early-career tech
      filing: a Software, Data or Product role at prevailing wage Level I or II.
    columns:
      - name: n
        description: Startups with at least one H-1B filing in the year after a raise.
      - name: with_entry_level
      - name: entry_level_share
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: small_sample
        description: True when `n` is under 30; treat the rate as rough.

  - name: mart_time_to_lca
    description: >
      Days from a Form D filing to the company's first H-1B filing after it, for raises that
      were followed by one within 12 months. One row per histogram bucket; `n` and the
      quartiles repeat on each row.
    columns:
      - name: bucket_order
        tests: [unique, not_null]
      - name: bucket
      - name: low_days
      - name: high_days
      - name: raises
      - name: share
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: n
      - name: median_days
      - name: p25_days
      - name: p75_days
      - name: small_sample
        description: True when `n` is under 30; treat the rate as rough.

  - name: mart_market_share
    description: The startups' share of Bay Area H-1B sponsorship, by distinct employer and by number of filings.
    columns:
      - name: n
        description: Distinct Bay Area employers with a certified H-1B LCA (by normalised name).
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: startup_employers
      - name: employer_share
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: lcas
      - name: startup_lcas
      - name: lca_share
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: small_sample
        description: True when `n` is under 30; treat the rate as rough.

  - name: mart_companies
    description: >
      One row per startup for the website's Explore table: its latest raise, whether it filed
      for H-1B workers before that raise, and a summary of all its matched H-1B filings.
    columns:
      - name: company_slug
        tests: [unique, not_null]
      - name: cik
        tests: [unique, not_null]
      - name: company
      - name: city
      - name: county_name
      - name: industry
      - name: first_raise_date
      - name: latest_raise_date
      - name: raise_count
      - name: total_sold
      - name: round_bin
        description: Size bucket of the latest raise.
      - name: latest_amount_sold
      - name: prior_24m
        description: H-1B filings in the 24 months before the latest raise.
      - name: after_12m
        description: H-1B filings in the 12 months from the latest raise.
      - name: sponsored_before
        description: True when `prior_24m` is at least 1.
      - name: has_full_followup
        description: True when the latest raise has a full year of LCA data after it.
      - name: lcas_total
        description: All matched certified H-1B LCAs in the data (October 2022 onward).
      - name: median_wage
      - name: first_lca_date
      - name: latest_lca_date
      - name: role_groups
        description: Comma-separated role groups the company has filed for.
      - name: has_page
        description: True when the company has at least one matched H-1B filing, so it gets its own page.

  - name: mart_company_monthly_lcas
    description: Matched H-1B filings per startup per calendar month.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cik, month]
    columns:
      - name: cik
      - name: month
        description: First day of the month.
      - name: lcas
      - name: new_hire_lcas

  - name: mart_company_roles
    description: Matched H-1B filings per startup by role group, with median pay.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cik, role_group]
    columns:
      - name: cik
      - name: role_group
      - name: lcas
      - name: early_career_lcas
        description: Filings at prevailing wage Level I or II.
      - name: median_wage
      - name: min_wage
      - name: max_wage

  - name: mart_company_officers
    description: >
      Executive officers named on each startup's latest Form D: name and relationship only,
      as published by the SEC. Addresses on the form are not carried over.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cik, person_seq]
    columns:
      - name: cik
      - name: person_seq
      - name: person_name
      - name: relationships
        description: Executive Officer, Director and/or Promoter.

  - name: mart_lca_employer_history
    description: >
      Certified H-1B LCAs per California employer per month, with counts by role group and for
      early-career wage levels. Exported to `data/seed_cache/lca_employer_history.parquet`.
    columns:
      - name: employer_name
        tests: [not_null]
      - name: trade_name_dba
      - name: employer_zip5
        tests: [not_null]
      - name: month
      - name: lcas
      - name: software_lcas
      - name: data_lcas
      - name: product_lcas
      - name: early_career_lcas

  - name: mart_listed_ciks
    description: CIKs that carried an SEC industry code on a Form D (listed companies). Exported to `data/seed_cache/listed_ciks.parquet`.
    columns:
      - name: cik
        tests: [unique, not_null]
